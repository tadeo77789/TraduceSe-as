services:

  db:
    image: postgres:16-alpine
    container_name: traduce-senas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: traduce_senas
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Los .sql se ejecutan en orden alfabetico solo la primera vez
      # que se crea el volumen (000_users.sql, 001_translations.sql, ...)
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d traduce_senas"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - senas-net

  backend:
    build: ./backend
    container_name: traduce-senas-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: traduce_senas
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-clave_secreta_desarrollo}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - senas-net

  frontend:
    build: ./src
    container_name: traduce-senas-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - senas-net

volumes:
  postgres_data:

networks:
  senas-net:
    driver: bridge
